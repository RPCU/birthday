name: Image

# Builds and pushes zot.rpcu.io/public/birthday:<tag>, where <tag> is the git
# tag for tag pushes and the 8-char commit SHA otherwise — the ref OpenChoreo's
# `prebuilt-image` workflow (hestia) waits for before publishing the workload.
on:
  push:
    branches: [main]
    tags: ['*.*.*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: zot.rpcu.io/public/birthday

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          TAGS="${IMAGE}:${SHORT_SHA}"
          VERSION="${SHORT_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME},${TAGS}"
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: zot.rpcu.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
